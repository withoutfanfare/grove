name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS tests and app build
    runs-on: macos-14
    env:
      GROVE_CLI_SOURCE: ${{ github.workspace }}/.build-inputs/grove-cli/grove

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache authorised private UI package
        env:
          STUNTROCKET_UI_TARBALL_URL: ${{ secrets.STUNTROCKET_UI_TARBALL_URL }}
        shell: bash
        run: |
          if [ -z "$STUNTROCKET_UI_TARBALL_URL" ]; then
            echo '::error::Set STUNTROCKET_UI_TARBALL_URL to an authorised HTTPS download for the exact @stuntrocket/ui tarball in package-lock.json. See docs/api/reproducible-macos-build.md.'
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "$STUNTROCKET_UI_TARBALL_URL" --output "$RUNNER_TEMP/stuntrocket-ui.tgz"
          node scripts/cache-ui.mjs "$RUNNER_TEMP/stuntrocket-ui.tgz"

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: Run frontend tests
        run: npm test

      - name: Type check and build frontend
        run: npm run build

      - name: Read pinned CLI revision
        id: cli
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          with open('src-tauri/sidecar.lock.json') as handle:
              pin = json.load(handle)
          if pin.get('repository') != 'https://github.com/withoutfanfare/grove-cli.git':
              raise SystemExit('Unexpected CLI repository in sidecar.lock.json')
          if not re.fullmatch(r'[0-9a-f]{40}', pin.get('revision', '')):
              raise SystemExit('Pin a committed 40-character CLI revision in sidecar.lock.json')
          if not re.fullmatch(r'[0-9a-f]{64}', pin.get('sha256', '')):
              raise SystemExit('Pin the built CLI SHA-256 in sidecar.lock.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + pin['revision'] + '\n')
          PY

      - name: Checkout pinned CLI source
        uses: actions/checkout@v4
        with:
          repository: withoutfanfare/grove-cli
          ref: ${{ steps.cli.outputs.revision }}
          path: .build-inputs/grove-cli
          token: ${{ secrets.GROVE_CLI_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build and verify pinned CLI
        run: |
          ./.build-inputs/grove-cli/build.sh
          npm run prepare-sidecar

      - name: Install CLI test runner
        run: brew install bats-core

      - name: Run CLI contract tests
        working-directory: .build-inputs/grove-cli
        shell: bash
        run: |
          shopt -s nullglob
          trust_tests=(tests/unit/trust*.bats tests/integration/trust*.bats)
          if [ "${#trust_tests[@]}" -eq 0 ]; then
            echo '::error::Pinned CLI checkout has no trust contract tests.'
            exit 1
          fi
          for test_file in "${trust_tests[@]}"; do ./run-tests.sh "$test_file"; done
          ./run-tests.sh config-resolution.bats
          ./run-tests.sh report-base.bats

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

      - name: Build unsigned macOS app
        run: npm run tauri -- build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Exercise the packaged bundled CLI without a PATH installation
        shell: bash
        run: |
          fixture_root="$(mktemp -d "$RUNNER_TEMP/grove-startup.XXXXXX")"
          trap 'rmdir "$fixture_root"' EXIT
          PATH=/usr/bin:/bin:/usr/sbin:/sbin HERD_ROOT="$fixture_root" GROVE_CONFIG=/dev/null \
            src-tauri/target/release/bundle/macos/Grove.app/Contents/MacOS/grove-app --check-bundled-cli

      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/*.app "$RUNNER_TEMP/grove-macos.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: grove-macos-unsigned
          path: ${{ runner.temp }}/grove-macos.zip
