name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run type check
        run: npm run build
        env:
          CI: true

  rust-tests:
    name: Rust Tests
    # macOS avoids installing the Linux WebKit libraries Tauri needs.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      # The app bundles the grove CLI as a sidecar binary; the build only
      # checks the file exists, so a placeholder is enough for tests.
      - name: Add placeholder sidecar
        working-directory: src-tauri
        run: |
          mkdir -p binaries
          printf '#!/bin/sh\n' > "binaries/grove-$(rustc -vV | sed -n 's/host: //p')"
          chmod +x binaries/grove-*

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
